name: acmer_qq_group_bot
display_name: acmerQQ群机器人
short_desc: ACM 竞赛信息查询与定时推送
desc: |
  提供牛客、Codeforces、AtCoder、洛谷比赛查询与定时推送（牛客按 OJ 归属收录全部赛事）；
  支持 XCPC Link 线下赛查询、四平台账号绑定、个人战绩卡、群排行、
  按用户名/UID 查询未绑定用户战绩卡、
  每日早报、赛前 15 分钟提醒、赛后赛果、群训练周报、牛客报名截止提醒与 WebUI 配置。
  数据来自各平台公开接口/页面，无需第三方 SDK 或登录 Cookie。
version: 1.14.6
author: td1336065617
repo: https://github.com/td1336065617/acmerQQ-group-bot/tree/master
astrbot_version: ">=4.13.0,<5"
support_platforms:
  - qq_official
